[package]
name = "lichess"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chess-core = { path = "../core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
console-subscriber = "0.5.0"
eyre = "0.6.14"
fern = { version = "0.7.1", features = ["colored"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
log = "0.4.34"
rand = "0.10.2"
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "tracing"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
